name: Disposable synthetic AthenZ D2 adapter verification
# Branch-only validation; remove this workflow before merge.
on:
  push:
    branches:
      - integration/athenz-d2-contract-v1
permissions:
  contents: read
concurrency:
  group: developmental-oneoff-d2
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: python -m compileall -q developmental_ai tests
      - name: New compatibility and simulator adapter tests
        run: |
          python -m unittest discover -s tests -p 'test_athenz*.py' -v
          python -m unittest discover -s tests -p 'test_d2_wire_compatibility.py' -v
          python -m unittest discover -s tests -p 'test_event_ledger.py' -v
      - name: Full Python suite
        run: python -m unittest discover -s tests -q
