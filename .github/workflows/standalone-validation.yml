name: Standalone learning validation

on:
  push:
    branches:
      - "priority/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q developmental_ai benchmarks tests
      - name: Full repository unit tests
        run: python -m unittest discover -s tests -v
      - name: Historical transfer regression (unchanged 3-seed protocol)
        run: python -m benchmarks.transfer_benchmark --seeds 17 23 41 --train-episodes 5000 --test-episodes 300
      - name: Symbolic skill reuse - development cohort
        run: python -m benchmarks.outcome_skills_benchmark --cohort dev
      - name: Symbolic skill reuse - inspected additional cohort
        run: python -m benchmarks.outcome_skills_benchmark --cohort additional
      - name: Sequential skill learning and retention - development
        run: python -m benchmarks.continual_skill_benchmark --cohort dev
      - name: Sequential skill learning and retention - inspected additional
        run: python -m benchmarks.continual_skill_benchmark --cohort additional
      - name: Observational prerequisite probing - development
        run: python -m benchmarks.prerequisite_probing_benchmark --cohort dev
      - name: Observational prerequisite probing - inspected additional
        run: python -m benchmarks.prerequisite_probing_benchmark --cohort additional
      - name: Prerequisite recovery comparison - development
        run: python -m benchmarks.prerequisite_recovery_benchmark --cohort dev
      - name: Prerequisite recovery comparison - inspected additional
        run: python -m benchmarks.prerequisite_recovery_benchmark --cohort additional
      - name: Opaque numeric cross-dynamics - development
        run: python -m benchmarks.opaque_causal_benchmark --cohort development
      - name: Opaque numeric cross-dynamics - reserved
        run: python -m benchmarks.opaque_causal_benchmark --cohort reserved
      - name: Stable numeric affordance memory - development
        run: python -m benchmarks.affordance_benchmark --cohort development
      - name: Stable numeric affordance memory - reserved
        run: python -m benchmarks.affordance_benchmark --cohort reserved
      - name: Context-dependent action meaning A-B-A - development
        run: python -m benchmarks.contextual_affordance_benchmark --cohort development
      - name: Context-dependent action meaning A-B-A - reserved
        run: python -m benchmarks.contextual_affordance_benchmark --cohort reserved
      - name: Cue-free diagnostic A-B-A - inspected development
        run: python -m benchmarks.no_cue_probe_benchmark --cohort development
      - name: Cue-free diagnostic A-B-A - inspected additional
        run: python -m benchmarks.no_cue_probe_benchmark --cohort inspected-additional
      - name: Unseen mapping C and union-risk control - inspected development
        run: python -m benchmarks.unseen_regime_benchmark --cohort development
      - name: Unseen mapping C and union-risk control - inspected additional
        run: python -m benchmarks.unseen_regime_benchmark --cohort inspected-additional

  windows-policy:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Policy review and original learner regression
        run: python -m unittest tests.test_policy_review tests.test_outcome_skills tests.test_continual_skill_benchmark tests.test_prerequisite_probing tests.test_prerequisite_recovery tests.test_opaque_causal tests.test_affordance_memory tests.test_contextual_affordance tests.test_no_cue_diagnostic tests.test_unseen_regime tests.test_transfer tests.test_organism -v
